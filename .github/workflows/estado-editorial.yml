name: Estado Editorial

on:
  push:
    branches:
      - main
    paths:
      - '.estado-proyecto.json'

permissions:
  discussions: write
  contents: write

jobs:
  procesar-estado:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Procesar artículos y actualizar Discussions
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // LEER ESTADO EDITORIAL GENERADO POR GBPUBLISHER
            const estado = JSON.parse(fs.readFileSync('.estado-proyecto.json', 'utf8'));

            // LEER IDS VÍA API — SIEMPRE OBTIENE LA VERSIÓN MÁS RECIENTE DEL REPO
            // SIN DEPENDER DEL ESTADO DEL CHECKOUT NI DE RACE CONDITIONS
            const idsPath = '.github-ids.json';
            let ids = {};
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: idsPath
              });
              ids = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
            } catch (e) {
              ids = {};
            }

            // OBTENER ID DEL REPOSITORIO Y CATEGORÍA
            const repoData = await github.graphql(`
              query($owner: String!, $name: String!) {
                repository(owner: $owner, name: $name) {
                  id
                  discussionCategories(first: 20) {
                    nodes { id name }
                  }
                }
              }
            `, {
              owner: context.repo.owner,
              name: context.repo.repo
            });

            const repoId = repoData.repository.id;
            const categoria = repoData.repository.discussionCategories.nodes
              .find(c => c.name === 'Seguimiento Editorial');

            if (!categoria) {
              core.setFailed('No se encontró la categoría "Seguimiento Editorial".');
              return;
            }

            let modificado = false;

            for (const articulo of estado.articulos) {
              const clave = articulo.nombre_archivo;
              const entrada = ids[clave] || {};

              // ARTÍCULO NUEVO: CREAR DISCUSSION
              if (!entrada.discussion_id) {

                const autores = Array.isArray(articulo.autores) && articulo.autores.length > 0
                  ? articulo.autores.join(' · ')
                  : 'N/D';

                const cuerpo = [
                  `**Proyecto:** ${estado.proyecto}`,
                  `**Archivo:** \`${articulo.nombre_archivo}\``,
                  `**Tipo:** ${articulo.tipo_articulo || 'N/D'}`,
                  `**DOI:** ${articulo.doi || 'pendiente'}`,
                  `**Autores:** ${autores}`,
                  `**Responsable:** ${articulo.responsable_edicion || 'N/D'}`,
                  ``,
                  `| Evento | Fecha |`,
                  `|--------|-------|`,
                  `| Recepción | ${articulo.fecha_recepcion || '—'} |`,
                  `| Aceptación | ${articulo.fecha_aceptacion || '—'} |`,
                  `| Publicación online | ${articulo.fecha_publicacion_online || '—'} |`,
                  ``,
                  `**Estado inicial:** \`${articulo.estado}\``,
                  ``,
                  `---`,
                  `*Seguimiento generado automáticamente por gbpublisher*`
                ].join('\n');

                const resultado = await github.graphql(`
                  mutation($repoId: ID!, $catId: ID!, $titulo: String!, $cuerpo: String!) {
                    createDiscussion(input: {
                      repositoryId: $repoId
                      categoryId: $catId
                      title: $titulo
                      body: $cuerpo
                    }) {
                      discussion { id url }
                    }
                  }
                `, {
                  repoId,
                  catId: categoria.id,
                  titulo: `[${articulo.estado.toUpperCase()}] ${articulo.titulo}`,
                  cuerpo
                });

                ids[clave] = {
                  discussion_id: resultado.createDiscussion.discussion.id,
                  ultimo_estado: articulo.estado
                };
                core.info(`Discussion creada: ${resultado.createDiscussion.discussion.url}`);
                modificado = true;

              // ESTADO CAMBIÓ: AGREGAR COMENTARIO A LA DISCUSSION EXISTENTE
              } else if (entrada.ultimo_estado && articulo.estado !== entrada.ultimo_estado) {

                const comentario = [
                  `### ✅ Cambio de estado`,
                  ``,
                  `| | |`,
                  `|---|---|`,
                  `| **Estado anterior** | \`${entrada.ultimo_estado}\` |`,
                  `| **Estado actual** | \`${articulo.estado}\` |`,
                  `| **Fecha** | ${new Date().toISOString().split('T')[0]} |`,
                  ``,
                  `*Actualización automática por gbpublisher*`
                ].join('\n');

                await github.graphql(`
                  mutation($discId: ID!, $cuerpo: String!) {
                    addDiscussionComment(input: {
                      discussionId: $discId
                      body: $cuerpo
                    }) {
                      comment { id }
                    }
                  }
                `, {
                  discId: entrada.discussion_id,
                  cuerpo: comentario
                });

                ids[clave].ultimo_estado = articulo.estado;
                core.info(`Comentario agregado: ${clave}`);
                modificado = true;
              }
            }

            // GUARDAR IDS VÍA API REST — SIN GIT, SIN RACE CONDITIONS
            if (modificado) {
              const contenido = Buffer.from(JSON.stringify(ids, null, 2)).toString('base64');

              let sha;
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: idsPath
                });
                sha = data.sha;
              } catch (e) {
                sha = undefined;
              }

              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: idsPath,
                message: 'meta: IDs de GitHub actualizados [skip ci]',
                content: contenido,
                sha: sha,
                branch: 'main'
              });

              core.info('IDs actualizados en .github-ids.json via API');
            } else {
              core.info('Sin cambios en esta ejecución.');
            }
